<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play To Open v1.6</title>
  <style>
    :root {
      --bg: #111418;
      --fg: #f2f4f7;
      --muted: #8a93a0;
      --chip: #232831;
      --chip-border: #353c48;
      --accent: #4f8cff;
      --good: #2ecc71;
      --bad: #ff4d4f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 480px;
      min-height: 100%;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    footer { margin-top: auto; text-align: center; color: var(--muted); font-size: 0.8rem; }

    input {
      width: 100%;
      font-size: 2rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--chip-border);
      background: var(--chip);
      color: var(--fg);
    }
    #chords { font-size: 1.6rem; letter-spacing: 0.1em; text-transform: none; }
    input:focus { outline: none; border-color: var(--accent); }
    .hint { color: var(--muted); font-size: 0.9rem; text-align: center; min-height: 1.2em; margin-top: -10px; }

    #chips { display: flex; flex-direction: column; gap: 10px; min-height: 64px; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .row:empty { display: none; }
    .chip {
      min-width: 56px; height: 64px; padding: 0 10px;
      display: grid; place-items: center;
      font-size: 1.8rem; font-weight: 700;
      border-radius: 10px;
      background: var(--chip);
      border: 2px solid var(--chip-border);
      transition: background 0.15s, border-color 0.15s;
    }
    .chip.next { border-color: var(--accent); }
    .chip.done { background: var(--good); border-color: var(--good); color: #0b1a10; }
    #chips.shake { animation: shake 0.35s; }
    #chips.shake .chip { border-color: var(--bad); }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    button {
      font-size: 1.4rem;
      font-weight: 700;
      padding: 18px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button.listening { background: var(--bad); }

    #heard {
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }
    #heard strong { color: var(--fg); font-size: 2.2rem; display: block; min-height: 1.2em; }
    #level { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
    #level div { height: 100%; width: 0; background: var(--accent); transition: width 0.05s; }

    #success {
      position: fixed; inset: 0;
      display: none;
      place-items: center;
      background: var(--good);
      color: #0b1a10;
      font-size: 3.5rem; font-weight: 900; letter-spacing: 0.05em;
    }
    #success.show { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 32px; animation: flash 0.9s; }
    #playAgain { background: #000; color: #fff; font-size: 1.4rem; padding: 18px 40px; letter-spacing: normal; }
    @keyframes flash {
      0%, 30%, 60% { background: #ffffff; }
      15%, 45%, 100% { background: var(--good); }
    }
  </style>
</head>
<body>
  <main>
    <input id="word" type="text" placeholder="CAGE" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="hint" id="hint">Notes A–G only</div>

    <input id="chords" type="text" placeholder="E Am G" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="hint" id="chordHint">Chords: A–G, add m for minor</div>

    <button id="listen" disabled>Listen</button>

    <div id="chips"><div class="row" id="noteRow"></div><div class="row" id="chordRow"></div></div>

    <div id="heard">Hearing<strong id="note">–</strong></div>
    <div id="level"><div></div></div>
    <div class="hint" id="micInfo"></div>

    <footer>Play To Open <span class="ver">v1.6</span></footer>
  </main>

  <div id="success">
    <div>SUCCESS</div>
    <button id="playAgain">Play again</button>
  </div>

  <script type="module">
    import { detectPitch, freqToNote, MIN_RMS } from './pitch.js?v=1.6';
    import { detectChord } from './chord.js?v=1.6';
    import { SequenceMatcher } from './sequence.js?v=1.6';

    const CHORD_STABLE_MS = 200; // strums are noisy at the start, so chords must hold a bit longer than notes
    const PITCH_WINDOW = 2048;   // samples used for single-note detection

    const wordEl = document.getElementById('word');
    const hintEl = document.getElementById('hint');
    const chordsEl = document.getElementById('chords');
    const chordHintEl = document.getElementById('chordHint');
    const chipsEl = document.getElementById('chips');
    const noteRowEl = document.getElementById('noteRow');
    const chordRowEl = document.getElementById('chordRow');
    const listenBtn = document.getElementById('listen');
    const noteEl = document.getElementById('note');
    const levelEl = document.querySelector('#level div');
    const successEl = document.getElementById('success');
    const micInfoEl = document.getElementById('micInfo');

    let notes = [];
    let chords = [];
    // Combined sequence: notes first, then chords. Prefixes keep note C and chord C distinct.
    let targets = [];
    let audio = null; // { ctx, stream, analyser, buf, spectrum }
    let matcher = null;
    let rafId = 0;

    wordEl.addEventListener('input', () => {
      const raw = wordEl.value.toUpperCase();
      const clean = raw.replace(/[^A-G]/g, '');
      hintEl.textContent = clean !== raw.replace(/\s/g, '') ? 'Only A–G are notes — other letters removed' : 'Notes A–G only';
      wordEl.value = clean;
      notes = clean.split('');
      inputsChanged();
    });

    chordsEl.addEventListener('input', () => {
      const tokens = chordsEl.value.split(/[\s,]+/).filter(Boolean);
      const bad = tokens.filter(t => !/^[a-g]m?$/i.test(t));
      chords = tokens.filter(t => /^[a-g]m?$/i.test(t)).map(t => t[0].toUpperCase() + (t.length > 1 ? 'm' : ''));
      chordHintEl.textContent = bad.length ? 'Not a chord: ' + bad.join(' ') : 'Chords: A–G, add m for minor';
      inputsChanged();
    });

    function inputsChanged() {
      targets = [...notes.map(n => 'n:' + n), ...chords.map(c => 'c:' + c)];
      if (audio) stop();
      renderChips(0);
      listenBtn.disabled = targets.length === 0;
    }

    function renderChips(doneCount) {
      const chip = (label, i) => {
        const el = document.createElement('div');
        el.className = 'chip' + (i < doneCount ? ' done' : i === doneCount && audio ? ' next' : '');
        el.textContent = label;
        return el;
      };
      noteRowEl.replaceChildren(...notes.map((n, i) => chip(n, i)));
      chordRowEl.replaceChildren(...chords.map((c, i) => chip(c, notes.length + i)));
    }

    function shake() {
      chipsEl.classList.remove('shake');
      void chipsEl.offsetWidth; // restart the animation
      chipsEl.classList.add('shake');
    }

    listenBtn.addEventListener('click', () => (audio ? stop() : start()));

    async function openMic() {
      // iOS Safari refuses capture unless the page's audio session allows recording.
      if (navigator.audioSession) navigator.audioSession.type = 'play-and-record';
      const constraints = { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } };
      try {
        return await navigator.mediaDevices.getUserMedia(constraints);
      } catch (err) {
        if (err.name === 'NotAllowedError' && /permission|denied/i.test(err.message)) throw err;
        await new Promise(r => setTimeout(r, 300)); // transient iOS audio session errors often clear on retry
        return navigator.mediaDevices.getUserMedia(constraints);
      }
    }

    // Shows what the browser actually applied, not just what was requested.
    function showMicSettings(stream) {
      const s = stream.getAudioTracks()[0].getSettings();
      const fmt = key => (s[key] === undefined ? 'n/a' : s[key] ? 'ON' : 'off');
      micInfoEl.textContent = `echo cancellation: ${fmt('echoCancellation')} · noise suppression: ${fmt('noiseSuppression')} · auto gain: ${fmt('autoGainControl')}`;
    }

    async function start() {
      try {
        const stream = await openMic();
        showMicSettings(stream);
        const ctx = new AudioContext();
        await ctx.resume(); // created after an await, so iOS may start it suspended
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 8192; // fine frequency resolution for chords
        analyser.smoothingTimeConstant = 0;
        ctx.createMediaStreamSource(stream).connect(analyser);
        audio = {
          ctx, stream, analyser,
          buf: new Float32Array(analyser.fftSize),
          spectrum: new Float32Array(analyser.frequencyBinCount),
        };
      } catch (err) {
        hintEl.textContent = /permission|denied/i.test(err.message)
          ? 'Microphone permission denied — allow it in Settings → Apps → Safari → Microphone'
          : 'Mic blocked by the browser — close other audio apps, then reload (' + err.message + ')';
        return;
      }
      matcher = new SequenceMatcher(targets);
      listenBtn.textContent = 'Stop';
      listenBtn.classList.add('listening');
      wordEl.disabled = chordsEl.disabled = true;
      renderChips(0);
      tick();
    }

    function stop() {
      cancelAnimationFrame(rafId);
      audio.stream.getTracks().forEach(t => t.stop());
      audio.ctx.close();
      audio = null;
      matcher = null;
      listenBtn.textContent = 'Listen';
      listenBtn.classList.remove('listening');
      wordEl.disabled = chordsEl.disabled = false;
      noteEl.textContent = '–';
      levelEl.style.width = '0';
      renderChips(0);
    }

    function tick() {
      const { analyser, buf, spectrum, ctx } = audio;
      analyser.getFloatTimeDomainData(buf);
      const { freq, rms } = detectPitch(buf.subarray(buf.length - PITCH_WINDOW), ctx.sampleRate);
      const chordPhase = targets[matcher.index].startsWith('c:');

      let heard = null;
      if (chordPhase) {
        analyser.getFloatFrequencyData(spectrum);
        heard = rms >= MIN_RMS ? detectChord(spectrum, ctx.sampleRate, analyser.fftSize) : null;
      } else if (freq) {
        heard = freqToNote(freq).name;
      }

      noteEl.textContent = heard ?? '–';
      levelEl.style.width = Math.min(100, rms * 400) + '%';

      const token = heard && (chordPhase ? 'c:' : 'n:') + heard;
      const ev = matcher.feed(token, rms, performance.now(), chordPhase ? CHORD_STABLE_MS : undefined);
      if (ev) handle(ev);
      if (audio) rafId = requestAnimationFrame(tick);
    }

    function handle(ev) {
      if (ev.type === 'correct') renderChips(ev.index + 1);
      else if (ev.type === 'wrong') { renderChips(ev.restartedAt); shake(); }
      else if (ev.type === 'success') {
        stop();
        renderChips(targets.length);
        successEl.classList.add('show');
      }
    }

    document.getElementById('playAgain').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
