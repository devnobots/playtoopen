<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play To Open v1.1</title>
  <style>
    :root {
      --bg: #111418;
      --fg: #f2f4f7;
      --muted: #8a93a0;
      --chip: #232831;
      --chip-border: #353c48;
      --accent: #4f8cff;
      --good: #2ecc71;
      --bad: #ff4d4f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 { margin: 0; font-size: 1.4rem; font-weight: 700; }
    h1 .ver { color: var(--muted); font-weight: 400; font-size: 0.9rem; }

    input {
      width: 100%;
      font-size: 2rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--chip-border);
      background: var(--chip);
      color: var(--fg);
    }
    input:focus { outline: none; border-color: var(--accent); }
    .hint { color: var(--muted); font-size: 0.9rem; text-align: center; min-height: 1.2em; margin-top: -10px; }

    #chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 64px; }
    .chip {
      width: 56px; height: 64px;
      display: grid; place-items: center;
      font-size: 1.8rem; font-weight: 700;
      border-radius: 10px;
      background: var(--chip);
      border: 2px solid var(--chip-border);
      transition: background 0.15s, border-color 0.15s;
    }
    .chip.next { border-color: var(--accent); }
    .chip.done { background: var(--good); border-color: var(--good); color: #0b1a10; }
    #chips.shake { animation: shake 0.35s; }
    #chips.shake .chip { border-color: var(--bad); }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    button {
      font-size: 1.4rem;
      font-weight: 700;
      padding: 18px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button.listening { background: var(--bad); }

    #heard {
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }
    #heard strong { color: var(--fg); font-size: 2.2rem; display: block; min-height: 1.2em; }
    #level { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
    #level div { height: 100%; width: 0; background: var(--accent); transition: width 0.05s; }

    #success {
      position: fixed; inset: 0;
      display: none;
      place-items: center;
      background: var(--good);
      color: #0b1a10;
      font-size: 3.5rem; font-weight: 900; letter-spacing: 0.05em;
      cursor: pointer;
    }
    #success.show { display: grid; animation: flash 0.9s; }
    @keyframes flash {
      0%, 30%, 60% { background: #ffffff; }
      15%, 45%, 100% { background: var(--good); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Play To Open <span class="ver">v1.1</span></h1>

    <input id="word" type="text" placeholder="CAGE" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="hint" id="hint">Notes A–G only</div>

    <div id="chips"></div>

    <button id="listen" disabled>Listen</button>

    <div id="heard">Hearing<strong id="note">–</strong></div>
    <div id="level"><div></div></div>
  </main>

  <div id="success">SUCCESS</div>

  <script type="module">
    import { detectPitch, freqToNote } from './pitch.js?v=1.1';
    import { SequenceMatcher } from './sequence.js?v=1.1';

    const wordEl = document.getElementById('word');
    const hintEl = document.getElementById('hint');
    const chipsEl = document.getElementById('chips');
    const listenBtn = document.getElementById('listen');
    const noteEl = document.getElementById('note');
    const levelEl = document.querySelector('#level div');
    const successEl = document.getElementById('success');

    let targets = [];
    let audio = null; // { ctx, stream, analyser, buf }
    let matcher = null;
    let rafId = 0;

    wordEl.addEventListener('input', () => {
      const raw = wordEl.value.toUpperCase();
      const clean = raw.replace(/[^A-G]/g, '');
      hintEl.textContent = clean !== raw.replace(/\s/g, '') ? 'Only A–G are notes — other letters removed' : 'Notes A–G only';
      wordEl.value = clean;
      targets = clean.split('');
      if (audio) stop();
      renderChips(0);
      listenBtn.disabled = targets.length === 0;
    });

    function renderChips(doneCount) {
      chipsEl.replaceChildren(...targets.map((n, i) => {
        const el = document.createElement('div');
        el.className = 'chip' + (i < doneCount ? ' done' : i === doneCount && audio ? ' next' : '');
        el.textContent = n;
        return el;
      }));
    }

    function shake() {
      chipsEl.classList.remove('shake');
      void chipsEl.offsetWidth; // restart the animation
      chipsEl.classList.add('shake');
    }

    listenBtn.addEventListener('click', () => (audio ? stop() : start()));

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        });
        const ctx = new AudioContext();
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        ctx.createMediaStreamSource(stream).connect(analyser);
        audio = { ctx, stream, analyser, buf: new Float32Array(analyser.fftSize) };
      } catch (err) {
        hintEl.textContent = 'Microphone unavailable: ' + err.message;
        return;
      }
      matcher = new SequenceMatcher(targets);
      listenBtn.textContent = 'Stop';
      listenBtn.classList.add('listening');
      wordEl.disabled = true;
      renderChips(0);
      tick();
    }

    function stop() {
      cancelAnimationFrame(rafId);
      audio.stream.getTracks().forEach(t => t.stop());
      audio.ctx.close();
      audio = null;
      matcher = null;
      listenBtn.textContent = 'Listen';
      listenBtn.classList.remove('listening');
      wordEl.disabled = false;
      noteEl.textContent = '–';
      levelEl.style.width = '0';
      renderChips(0);
    }

    function tick() {
      const { analyser, buf, ctx } = audio;
      analyser.getFloatTimeDomainData(buf);
      const { freq, rms } = detectPitch(buf, ctx.sampleRate);
      const note = freq ? freqToNote(freq) : null;

      noteEl.textContent = note ? note.name : '–';
      levelEl.style.width = Math.min(100, rms * 400) + '%';

      const ev = matcher.feed(note && note.name, rms, performance.now());
      if (ev) handle(ev);
      if (audio) rafId = requestAnimationFrame(tick);
    }

    function handle(ev) {
      if (ev.type === 'correct') renderChips(ev.index + 1);
      else if (ev.type === 'wrong') { renderChips(ev.restartedAt); shake(); }
      else if (ev.type === 'success') {
        stop();
        renderChips(targets.length);
        successEl.classList.add('show');
      }
    }

    successEl.addEventListener('click', () => {
      successEl.classList.remove('show');
      renderChips(0);
    });
  </script>
</body>
</html>
